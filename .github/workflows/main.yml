name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk forest-widgets.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest forest-widgets.apk --title "숲 위젯 최신 버전" --notes "휴대폰에서 forest-widgets.apk 를 눌러 다운로드하세요."
